name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # refresh-data から呼ばれたときは、bot が commit したあとの main を取る。
      # 既定では workflow を起動した時点の SHA になるため、
      # せっかく取り直したデータを含まない状態で配信してしまう。
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # 匿名キーは公開してよい値。守りはデータベース側の RLS。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 作品単位のアフィリエイトリンクを組み立てるのに要る。
          # これも公開の値で、API が返す一覧URLに現れる。
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          SOKMIL_AFFILIATE_ID: ${{ secrets.SOKMIL_AFFILIATE_ID }}
          # 未設定なら MGS のリンクは出ない。
          MGS_AFFILIATE_CODE: ${{ secrets.MGS_AFFILIATE_CODE }}
          # 駿河屋アフィリエイトの user_id。**未設定ならリンクを出さない。**
          SURUGAYA_AFFILIATE_ID: ${{ secrets.SURUGAYA_AFFILIATE_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
