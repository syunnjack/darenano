name: IndexNow

# 追加されたページだけを IndexNow に送る。
#
# 以前は push のたびにサイトマップの先頭10,000件を送り直していた。
# 中身が変わっていないURLを繰り返し送っても意味がなく、送りすぎとして
# 扱われかねないため、公開済みURLの記録（published-slugs.txt）に
# 増えた行だけを送るようにした。
#
# 手動実行のときは、サイトマップ全体（最大10,000件）を送る。

on:
  push:
    branches: [main]
    paths:
      - 'public/data/published-slugs.txt'
      - 'public/data/published-pages.txt'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 送るURLを決める
        id: collect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので、サイトマップ全体を送ります。"
            # head でパイプを閉じると grep が SIGPIPE で落ち、pipefail のせいで
            # ジョブごと失敗する。いったん全部書き出してから切る。
            # sitemap.xml は**索引**になった（1ファイル50,000URLの上限を
            # 超えたため）。中の sitemap-*.xml を順に取ってURLを集める。
            curl -fsS "https://darekore.jp/sitemap.xml" > sitemap.xml
            : > all-urls.txt
            grep -oP '(?<=<loc>)[^<]+' sitemap.xml               | while read -r part; do
                  curl -fsS "$part" | grep -oP '(?<=<loc>)[^<]+' >> all-urls.txt
                done
            head -10000 all-urls.txt > urls.txt
            echo "サイトマップ $(wc -l < all-urls.txt)件のうち $(wc -l < urls.txt)件を送ります。"
          else
            # 直前のコミットとの差分で、増えたぶんだけを拾う。
            #
            # **2つのファイルを見る。** 出演者はスラッグ、それ以外
            # （シリーズ・レーベル・同人・新着など）は URL がそのまま入っている。
            # 以前は前者しか見ておらず、8,000ページ増えても1件も通知されなかった。
            : > new-urls.txt

            # **grep は該当が無いと終了コード1を返す。** set -e と組み合わせると
            # 「増えたURLが無かった」だけでジョブが落ちる。|| true で受ける。
            git diff HEAD~1 HEAD -- public/data/published-slugs.txt \
              | { grep '^+[^+]' || true; } | sed 's/^+//' \
              | while read -r slug; do
                  [ -n "$slug" ] && printf 'https://darekore.jp/actress/%s/\n' \
                    "$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$slug")"
                done >> new-urls.txt

            git diff HEAD~1 HEAD -- public/data/published-pages.txt \
              | { grep '^+https://' || true; } | sed 's/^+//' >> new-urls.txt

            # ここも head でパイプを閉じないよう、ファイル経由で切る。
            head -10000 new-urls.txt > urls.txt
          fi

          count=$(wc -l < urls.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "送るURL: ${count}件"

      - name: 公開されるまで待つ
        if: steps.collect.outputs.count != '0'
        run: |
          set +e
          for i in $(seq 1 30); do
            if curl -fsS https://darekore.jp/sitemap.xml | grep -q '<lastmod>'; then
              echo "公開を確認しました。"
              exit 0
            fi
            echo "公開待ち... ($i/30)"
            sleep 20
          done
          echo "待ち時間を過ぎました。そのまま送信します。"

      - name: IndexNow に送る
        if: steps.collect.outputs.count != '0'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          KEY="${INDEXNOW_KEY:-darekoreindex2026}"

          python3 - "$KEY" urls.txt payload.json <<'PY'
          import json
          import sys

          key, urls_path, payload_path = sys.argv[1:]

          with open(urls_path, encoding='utf-8') as source:
              urls = [line.strip() for line in source if line.strip()]

          payload = {
              'host': 'darekore.jp',
              'key': key,
              'keyLocation': f'https://darekore.jp/{key}.txt',
              'urlList': urls,
          }

          with open(payload_path, 'w', encoding='utf-8') as destination:
              json.dump(payload, destination, ensure_ascii=False)
          PY

          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "@payload.json"
