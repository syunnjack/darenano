name: Fetch FANZA items

# FANZA の作品データ（作品単位のURL）を取り直す。
#
# これまで FANZA へのリンクは出演者の一覧ページだけで、作品そのもののURLを
# 1本も持っていなかった。そのため DMM アフィリエイトの「ダイレクト報酬」が
# 構造的に発生しない状態だった。作品側からなめて、出演者ごとの出演作品と
# シリーズ・レーベルの一覧を作る。
#
# 発売月ごとに区切って取る。1回のなめで全員ぶんが揃うので、出演者ごとに
# 叩く（28,000回）必要はない。途中で止まっても data/fanza-items-state.json に
# 「次に取る月」が残るので、もう一度動かせば続きから取る。

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: '取り始める月（YYYY-MM。空なら前回の続き）'
        type: string
        required: false
      max_minutes:
        description: '何分で打ち切るか'
        type: string
        default: '300'
      reset:
        description: '前回の結果を捨てて最初から取り直す'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FANZA の作品を取る
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          FROM_MONTH: ${{ inputs.from_month }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          RESET: ${{ inputs.reset && '1' || '' }}
        run: python scripts/fetch-fanza-items.py

      - name: 取れた量を見る
        run: |
          ls -la data/
          python - <<'PY'
          import json, pathlib
          for name in ('fanza-actress-works', 'fanza-series', 'fanza-labels', 'fanza-newest'):
              path = pathlib.Path('data') / f'{name}.json'
              if not path.exists():
                  print(f'{name}: まだ無い')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              key = next(k for k in ('actresses', 'series', 'labels', 'items') if k in data)
              print(f'{name}: {len(data[key]):,} 件 / 見た作品 {data.get("scanned", 0):,}')
          PY

      - name: 変化があれば commit する
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変化はありませんでした。"
            exit 0
          fi
          git commit -m "FANZA の作品データを取り直す"
          # **取り直しは何本も同時に走る。** 同時に push すると片方が落ち、
          # 数時間ぶんの取得がまるごと消える。競合したら待って引き直す。
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true
              break
            fi
            echo "push が競合しました（${attempt}回目）。待って試します。"
            sleep $((15 * attempt))
          done
          if [ "$pushed" != true ]; then
            echo "push できませんでした。取れたデータは残っていません。" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # bot の push では deploy が起動しないため、ここから明示的に呼ぶ。
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    # これが無いと Secret が渡らない（再利用ワークフローは自動では受け取らない）。
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
