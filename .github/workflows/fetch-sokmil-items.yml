name: Fetch Sokmil items

# ソクミルの作品データを取り直す。
#
# これまでソクミルへのリンクは出演者のページ1本だけで、作品そのもののURLが
# 無かった。2026年8月の実績はクリック 323 に対して成果 0 件。
# 作品側から一度なめて、出演者ごとの出演作品を作る。
#
# **連続で叩くと 403 を返す。** 1.5秒空けて取り、途中で止まっても
# data/sokmil-items-state.json の offset から続きを取る。

on:
  workflow_dispatch:
    inputs:
      probe:
        description: '応答の形だけ見て終わる'
        type: boolean
        default: false
      max_minutes:
        description: '何分で打ち切るか'
        type: string
        default: '300'
      reset:
        description: '前回の結果を捨てて最初から取り直す'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ソクミルの作品を取る
        env:
          SOKMIL_API_KEY: ${{ secrets.SOKMIL_API_KEY }}
          SOKMIL_AFFILIATE_ID: ${{ secrets.SOKMIL_AFFILIATE_ID }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          RESET: ${{ inputs.reset && '1' || '' }}
          PROBE: ${{ inputs.probe && '1' || '' }}
        run: python scripts/fetch-sokmil-items.py

      - name: 変化があれば commit する
        id: commit
        if: ${{ !inputs.probe }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変化はありませんでした。"
            exit 0
          fi
          git commit -m "ソクミルの作品データを取り直す"
          git pull --rebase --autostash origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # bot の push では deploy が起動しないため、ここから明示的に呼ぶ。
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
