name: Probe FANZA urls
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          # **API を叩くIDは -990〜-999 でないと 400 になる。**
          # サイトのリンク用の承認済みID（-019）とは別物。
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_API_AFFILIATE_ID }}
        run: python scripts/probe-fanza-urls.py
