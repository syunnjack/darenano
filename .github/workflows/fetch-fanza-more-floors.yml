name: Fetch FANZA more floors

# 出演者ページを厚くするため、動画以外のフロアも取る。
#   DVD / 見放題ch / 写真集 / 成人映画
#
# 出演者IDが動画と共通なので、1ページに並べられる。
# 発売月で区切って取り、途中で止まっても data/fanza-more-state.json の
# フロアごとの「次に取る月」から続きを取る。

on:
  workflow_dispatch:
    inputs:
      only_floor:
        description: 'フロア（dvd,monthly,photo,cinema のうち。空なら全部）'
        type: string
        required: false
      max_minutes:
        description: '何分で打ち切るか'
        type: string
        default: '300'
      reset:
        description: '前回の結果を捨てて最初から'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 動画以外のフロアを取る
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          ONLY_FLOOR: ${{ inputs.only_floor }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          RESET: ${{ inputs.reset && '1' || '' }}
        run: python scripts/fetch-fanza-more-floors.py

      - name: 変化があれば commit する
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変化はありませんでした。"
            exit 0
          fi
          git commit -m "FANZA の動画以外のフロアを取り直す"
          # **取り直しは何本も同時に走る。** 同時に push すると片方が落ち、
          # 数時間ぶんの取得がまるごと消える。競合したら待って引き直す。
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true
              break
            fi
            echo "push が競合しました（${attempt}回目）。待って試します。"
            sleep $((15 * attempt))
          done
          if [ "$pushed" != true ]; then
            echo "push できませんでした。取れたデータは残っていません。" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
